name: Publish Userscripts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-userscripts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate userscript syntax
        run: python3 tools/check_userscripts_syntax.py

      - name: Build userscripts
        run: python3 tools/build_userscripts.py

      - name: Publish legacy artifacts to userscripts branch
        shell: bash
        run: |
          set -euo pipefail

          publish_dir="$(mktemp -d)"

          if git ls-remote --exit-code --heads origin userscripts >/dev/null 2>&1; then
            git fetch origin userscripts
            git worktree add "$publish_dir" origin/userscripts
            git -C "$publish_dir" switch -C userscripts
          else
            git worktree add --detach "$publish_dir"
            git -C "$publish_dir" switch --orphan userscripts
          fi

          cp -R dist/. "$publish_dir"/

          cat > "$publish_dir/README.md" <<'EOF'
          # Generated userscripts

          Cette branche publie les artefacts legacy générés depuis `main`.
          Les releases PimpMyShoutbox V4 sont publiées séparément depuis un tag immuable.
          Les anciens fichiers V4 présents ici sont conservés temporairement pour
          ne pas rompre les vérifications de mise à jour des installations existantes.
          EOF

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add --all

          if git -C "$publish_dir" diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git -C "$publish_dir" commit -m "Publish userscripts for ${GITHUB_SHA}"
          # La branche est append-only : une publication concurrente ou une
          # réécriture de l'historique est refusée au lieu d'écraser un artefact.
          git -C "$publish_dir" push origin userscripts
