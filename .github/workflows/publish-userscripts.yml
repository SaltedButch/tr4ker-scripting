name: Publish Userscripts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-userscripts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Validate userscript syntax
        run: python3 tools/check_userscripts_syntax.py

      - name: Build userscripts
        run: python3 tools/build_userscripts.py

      - name: Build PimpMyShoutbox Next
        working-directory: next/pimpmyshoutbox
        run: |
          npm ci
          npm test
          npm run check

      - name: Stage PimpMyShoutbox Next artifacts
        run: |
          cp next/pimpmyshoutbox/dist/pimpmyshoutbox-next.user.js dist/pimpmyshoutbox-next.user.js
          cp next/pimpmyshoutbox/dist/pimpmyshoutbox-next.meta.js dist/pimpmyshoutbox-next.meta.js

      - name: Publish userscripts artifacts to userscripts branch
        shell: bash
        run: |
          set -euo pipefail

          publish_dir="$(mktemp -d)"

          if git ls-remote --exit-code --heads origin userscripts >/dev/null 2>&1; then
            git fetch origin userscripts
            git worktree add "$publish_dir" origin/userscripts
            git -C "$publish_dir" switch -C userscripts
          else
            git worktree add --detach "$publish_dir"
            git -C "$publish_dir" switch --orphan userscripts
          fi

          cp -R dist/. "$publish_dir"/

          cat > "$publish_dir/README.md" <<'EOF'
          # Generated userscripts

          Cette branche publie les scripts legacy et PimpMyShoutbox Next générés depuis `main`.
          Les URL raw des fichiers `.meta.js` et `.user.js` restent stables pour
          permettre la détection et l'installation des mises à jour.
          EOF

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add --all

          if git -C "$publish_dir" diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git -C "$publish_dir" commit -m "Publish userscripts for ${GITHUB_SHA}"
          # Les artefacts évoluent par commits ; aucun push forcé ni réécriture
          # de l'historique n'est utilisé.
          git -C "$publish_dir" push origin userscripts
